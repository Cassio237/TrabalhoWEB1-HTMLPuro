<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orçamentos</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/lista.js" defer></script>
</head>
<body>

  <div class="app-layout">

    <!-- ===================== MENU LATERAL ===================== -->
    <aside class="sidebar">
      <h2 class="sidebar-title">OrçamentoKS</h2>
      <nav class="sidebar-menu">
        <button type="button" id="menuOrcamentos" class="sidebar-item active">Orçamentos</button>
        <button type="button" id="menuClientes" class="sidebar-item">Clientes</button>
      </nav>
    </aside>

    <!-- ===================== CONTEÚDO PRINCIPAL ===================== -->
    <main class="main-content">

      <header class="main-header">
        <h1>Orçamentos</h1>
        <a href="orcamento.html" id="btnNovoOrcamento" class="btn btn-primary btn-new">
          + Novo orçamento
        </a>
      </header>

      <section id="listaOrcamentosContainer" class="list-container">
        <!-- Preenchido via JS. Vazio por padrão. -->
        <p id="listaVaziaMsg" class="empty-state">Nenhum orçamento criado ainda.</p>
        <ul id="listaOrcamentos" class="orcamentos-list"></ul>
      </section>

    </main>

  </div>

</body>
</html>
