<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../src/app/favicon.ico">
    <title>Entrar - FinPlan</title>
    <script defer src="js/main.js"></script>
    <script defer src="js/login.js"></script>
    <!-- Evita o flash -->
    <script>
        try {
            const temax = localStorage.getItem('tema');
            if (temax === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (e) {
            console.error('Erro ao acessar o localStorage:', e);
        }
    </script>

    <link rel="stylesheet" href="css/globals.css">
    <link rel="stylesheet" href="css/auth.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <header>
        <div class="acessibilidade" role="group" aria-label="Acessibilidade">
            <button type="button" id="btnTema" aria-pressed="false" aria-label="Alternar tema escuro">
                <i class="bi bi-moon-fill mostra-no-claro" aria-hidden="true"></i>
                <i class="bi bi-sun-fill mostra-no-escuro" aria-hidden="true"></i>
                <span class="mostra-no-claro">Tema Escuro</span>
                <span class="mostra-no-escuro">Tema Claro</span>
            </button>
        </div>
    </header>

    <main>

        <form id="formLogin" action="" method="post">
            <!-- Eu troco components do lucide para o boostrap por conveniencia -->
            <div class="logo">
                <i class="bi bi-wallet2" aria-hidden="true"></i>
                <div class="logo-text">
                    <h1>FinPlan</h1>
                    <p>Meu norte</p>
                </div>
            </div>
            <h2>Bem-vindo (a) de volta</h2>
            <p>Entre para continuar acompanhando suas finanças.</p>
            <div class="form-group">
                <label for="emailEntrada">Email:</label>
                <input type="email" id="emailEntrada" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="senhaEntrada">Senha:</label>
                <div class="senha-container">
                    <input class="senha" type="password" id="senhaEntrada" name="senha" autocomplete="current-password"
                        required>
                    <button class="btn-toggle-senha" id="btnToggleSenha" type="button" aria-label="Mostrar senha">
                        <i class="bi bi-eye-fill" aria-hidden="true"></i>
                    </button>
                </div>
                <p class="recuperar-senha">
                    Esqueceu a senha?
                    <button type="button" class="btn-link" id="btnRecuperarSenha" aria-haspopup="dialog">
                        Recuperar senha
                    </button>
                </p>
            </div>
            <button type="submit">Entrar</button>
            <p>Não tem uma conta? <a href="registro.html">Criar Conta</a></p>
            <p id="msgFeedback"></p>
        </form>

        <dialog class="modal modal-estreito" id="modalRecuperar" aria-labelledby="tituloModalRecuperar">
            <div class="modal-topo">
                <div>
                    <h2 id="tituloModalRecuperar">Recuperar senha</h2>
                    <p>Informe o seu email para receber as instruções.</p>
                </div>
                <button type="button" class="btn-icone btn-sem-borda" id="btnFecharModalRecuperar" aria-label="Fechar">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
            <form class="modal-form" id="formRecuperar" method="dialog">
                <div class="form-group">
                    <label for="emailRecuperar">Email:</label>
                    <input type="email" id="emailRecuperar" name="email" autocomplete="email" required>
                </div>
                <p class="mensagem" id="msgRecuperar" role="status" hidden></p>
                <div class="modal-acoes">
                    <button type="button" class="btn" id="btnCancelarRecuperar">Cancelar</button>
                    <button type="submit" class="btn btn-primario">Enviar</button>
                </div>
            </form>
        </dialog>
    </main>

    <footer>
        <p>&copy; 2026 Projeto Web 1</p>
    </footer>

</body>

</html>
